services:
  - type: web
    name: metaverso-rag
    runtime: docker
    dockerfilePath: ./metaverso/Dockerfile
    dockerContext: ./metaverso

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: PDF_DIR
        value: /app/Data
      - key: CHROMA_PERSIST_DIR
        # O Dockerfile já roda build_ingest.py no build e grava o índice em
        # /app/chroma_db_export dentro da própria imagem — apontar para o
        # disco persistente (vazio) fazia o app tentar reingestar do zero
        # a cada request e travar/OOM.
        value: /app/chroma_db_export

disks:
  - name: chroma-data
    sizeGB: 5
    mountPath: /var/data/chroma
