services:
  - type: web
    name: metaverso-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma

disks:
  - name: chroma-data
    sizeGB: 5
    mountPath: /var/data/chroma
